name: update-tools

# Every day, resolve the newest upstream release of each wired tool, betas
# included, and commit changed version pins directly to main. The images are not
# rebuilt or rerun here, since that needs a container runtime and the model key;
# the results are refreshed on a machine that can run the sweep.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-tools
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Resolve newest versions
        id: bump
        run: |
          go run scripts/update_tools.go
          if git diff --quiet -- tools/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes to main
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name 'Tam Nguyen Duc'
          git config user.email '1218621+tamnd@users.noreply.github.com'
          git config commit.gpgsign false
          git add tools/
          git commit -m "Bump wired tools to their newest releases"
          git push origin HEAD:main
